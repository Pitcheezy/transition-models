name: Public host release
on:
  pull_request:
    paths: ["src/operations/**", "scripts/build_public_host_release.py", "scripts/check_public_host_config.py", "scripts/estimate_public_host_cost.py", "tests/test_public_host_release.py", "tests/test_public_host_config.py", "tests/test_public_host_cost.py", "ops/public-host/examples/**", ".github/workflows/public-host-release.yml"]
  push:
    paths: ["src/operations/**", "scripts/build_public_host_release.py", "scripts/check_public_host_config.py", "scripts/estimate_public_host_cost.py", "tests/test_public_host_release.py", "tests/test_public_host_config.py", "tests/test_public_host_cost.py", "ops/public-host/examples/**", ".github/workflows/public-host-release.yml"]
permissions:
  contents: read
jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_public_host_release.py tests/test_public_host_config.py tests/test_public_host_cost.py -q
        env:
          PYTHONUTF8: "1"
