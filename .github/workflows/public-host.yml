name: Public host transport
on:
  pull_request:
    paths: ["ops/public-host/**", ".github/workflows/public-host.yml"]
  push:
    branches: [main]
    paths: ["ops/public-host/**", ".github/workflows/public-host.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: public-host-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: ops/public-host
      - run: npm run check
        working-directory: ops/public-host
      - run: npm test
        working-directory: ops/public-host
