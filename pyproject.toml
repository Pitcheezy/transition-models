[project]
name = "transition-models"
version = "0.1.0"
description = "Comparing transition probability models for SmartPitch MDP"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hyunjun Cho" }
]

dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pybaseball>=2.2.7",
    "scikit-learn>=1.5.0",
    "wandb>=0.18.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "lightgbm>=4.0.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
