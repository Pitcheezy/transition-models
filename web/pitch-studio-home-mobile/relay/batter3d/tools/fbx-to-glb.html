<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mixamo FBX 검사와 glb 변환</title>
    <meta name="robots" content="noindex" />
    <!-- 개발 도구. Mixamo FBX(With Skin) 4개를 로컬 자산 서버(127.0.0.1:8794)에서 읽어 검사하고,
         캐릭터 1개 + 클립(idle, contact, contact_hit, contact_hit1, contact_hit2, miss)을 glb 하나로 묶어 build/<출력 이름>.glb 와 .meta.json 으로 저장한다.
         외부 네트워크 요청 없음. 호스트(relay) 코드와 무관.
         단위 2(11/8): 출력 이름 지정(기본 batter-indexed, 기존 batter.glb는 덮어쓰지 않음), 모든 속성이 비트 단위로 같은 정점만 합치는 인덱스화,
         저장 응답 실패 시 즉시 중단, 저장 뒤 다시 읽어 SHA-256 대조. 삼각형 감축·압축은 하지 않는다.
         단위 4(11/9): '캐릭터 종류' 선택. ctl = 외부 구매 타자 모델(산출물은 Git에 넣지 않음):
         ANIM_*.fbx 4개(각각 스킨 메시+뼈 68+클립 1, 30 fps) + SM_A-Pose_with_baseball.fbx(배트 메시의 출처). 뼈 이름을 모듈 규약(Hips, LeftHand …)으로 바꾸고,
         TGA 텍스처는 미리 만든 PNG로 돌려 읽고, Phong 재질을 Standard(PBR)로 바꾸며, 전부 1.0인 정점 색을 지우고, 실제 배트 메시를 손 뼈 아래 'Bat' 노드로 이식한다(모듈 원통 배트 끔).
         meta.play(연출 기준 시점·재생 끝)를 넣어 호스트 어댑터가 모델별 구간을 읽는다. -->
    <style>
      :root { color-scheme: light; font-family: "Malgun Gothic", "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; padding: 12px 16px; background: #f4f7ef; color: #0f2217; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      button { font: inherit; padding: 6px 12px; margin: 0 6px 6px 0; border: 1px solid #4f6457; border-radius: 8px; background: #e8eee0; color: #0f2217; }
      button:disabled { opacity: .5; }
      label { font-size: 13px; margin-right: 10px; }
      input[type=text] { font: inherit; font-size: 13px; padding: 2px 6px; }
      pre { font-size: 12px; line-height: 1.45; white-space: pre-wrap; background: #e8eee0; border-radius: 8px; padding: 10px; max-height: 60vh; overflow: auto; }
      canvas { display: block; width: 320px; height: 320px; background: #dfe8d6; border-radius: 8px; }
      .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    </style>
    <script type="importmap">
      { "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }
    </script>
  </head>
  <body>
    <h1>Mixamo FBX 검사와 glb 변환 (로컬 도구)</h1>
    <div>
      <label>캐릭터 종류 <select id="profile"><option value="mixamo" selected>Mixamo 마네킹/캐릭터(파일 4개)</option><option value="ctl">외부 구매 타자 모델(파일 5개)</option></select></label>
      <label>자산 서버 <input id="base" type="text" value="http://127.0.0.1:8794" size="26" /></label>
      <label>입력 폴더 <input id="srcDir" type="text" value="mixamo" size="18" pattern="[A-Za-z0-9_\-\/]+" /> (자산 서버 아래, 예: mixamo/remy — 캐릭터별 하위 폴더에 같은 4개 파일 이름으로 둔다)</label>
      <label id="contactPickWrap">접촉 스윙으로 쓸 파일
        <select id="contactPick"><option value="Baseball_Hit">Baseball_Hit</option><option value="Baseball_Hit_1">Baseball_Hit_1</option><option value="Baseball_Hit_2">Baseball_Hit_2</option></select>
      </label>
    </div>
    <div>
      <label>출력 이름 <input id="outName" type="text" value="batter-indexed" size="18" pattern="[A-Za-z0-9_\-]+" /> (build/이름.glb, 이름.meta.json)</label>
      <label><input id="doIndex" type="checkbox" checked /> 인덱스화(POSITION·NORMAL·TEXCOORD·JOINTS·WEIGHTS 전부 같은 정점만 합침)</label>
      <label><input id="allowOverwrite" type="checkbox" /> 기존 파일 덮어쓰기 허용(기본 꺼짐: 기존 결과물 보존)</label>
    </div>
    <div>
      <label>텍스처 최대 변 <select id="texMax"><option value="0">원본 그대로</option><option value="1024" selected>1024 px</option><option value="512">512 px</option></select></label>
      <label>텍스처 형식 <select id="texMime"><option value="image/png">PNG(무손실, 큼)</option><option value="image/webp" selected>WebP(EXT_texture_webp, 작음)</option><option value="image/jpeg">JPEG(알파 없음)</option></select></label>
      (사람형 캐릭터처럼 텍스처가 있는 FBX에만 영향. 마네킹(텍스처 0)은 무관)
    </div>
    <div>
      <button id="inspect" type="button">1. 검사(입력 폴더의 파일 4개 읽기)</button>
      <button id="build" type="button" disabled>2. glb 만들고 저장 → 다시 읽어 SHA 대조</button>
      <button id="verify" type="button" disabled>3. 저장한 glb 다시 읽어 확인</button>
    </div>
    <div class="row">
      <canvas id="view" width="640" height="640"></canvas>
      <pre id="log">대기 중</pre>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      import * as BufferGeometryUtils from "three/addons/utils/BufferGeometryUtils.js";

      const FILES = ["Baseball_Hit", "Baseball_Hit_1", "Baseball_Hit_2", "Baseball_Strike"];
      const $ = (id) => document.getElementById(id);
      const SHA = { // 2026-11-08 sha256sum 출력(D:\pitcheezy_assets\mixamo)
        Baseball_Hit: "f395f753a1aae3f96d7101702c1c41d79d9b3ee0c4717898ee6320a4038c197b",
        Baseball_Hit_1: "f33d2ff20816ca17f573db006e1e365cc31bd17f169a492ccce5c83e0ba229eb",
        Baseball_Hit_2: "6e16c8a2cbd5ef05191a3cf3226f72e8d79399fd1bfb95801b7650da76771f79",
        Baseball_Strike: "f6e1d54f8c46bc9c5b2957f8c6a81f58aa5a2ee59e6ead578faf8392cbb80420",
      };
      const PROFILES = {
        mixamo: { files: FILES, required: ["Baseball_Hit", "Baseball_Strike"], charFile: "Baseball_Hit", srcDir: "mixamo", outName: "batter-indexed",
          license: "Adobe Mixamo FAQ: royalty free for personal, commercial, and non-profit projects (2026-11-08 확인). 원본 단독 재배포 금지로 취급" },
        ctl: { files: ["ANIM_Hit_Ball", "ANIM_Missing_Ball", "ANIM_Idle", "ANIM_Prepare_To_Batting", "SM_A-Pose_with_baseball"], required: ["ANIM_Hit_Ball", "ANIM_Missing_Ball", "ANIM_Idle", "SM_A-Pose_with_baseball"],
          charFile: "ANIM_Hit_Ball", srcDir: "unity/ctl", outName: "batter-ctl",
          clipMap: { ANIM_Hit_Ball: "contact", ANIM_Missing_Ball: "miss", ANIM_Idle: "idle", ANIM_Prepare_To_Batting: "prepare" },
          // 모듈(batter3d.js)이 이름 끝으로 찾는 역할 뼈. 나머지 뼈 이름은 그대로 둔다(spine_03·neck_01은 원본부터 같은 이름이 둘씩 있음 → 트랙은 첫 번째에만 묶인다, README 참고)
          boneMap: { Pelvis: "Hips", head: "Head", Hand_L: "LeftHand", Hand_R: "RightHand", index_01_l: "LeftHandIndex1", pinky_01_l: "LeftHandPinky1", index_01_r: "RightHandIndex1", pinky_01_r: "RightHandPinky1", Foot_L: "LeftFoot", Foot_R: "RightFoot", ball_l: "LeftToeBase", ball_r: "RightToeBase" },
          bat: { from: "SM_A-Pose_with_baseball", mesh: "Baseball_Bat", bone: "Dummy_Baseball_Bat" },
          // 호스트 재생 끝(초). contact: 원본 2.1667 s 중 1.9 s부터 1루로 달리며 왼발이 들려(11/9 Node·데모 21표본 측정) 두 발이 땅에 있는 팔로스루 끝 1.85 s에서 멈춘다. miss: 원본 끝(타격 자세로 복귀)
          playEnd: { contact: 1.85, take: 2.6, hit: 2.9 }, playCue: { take: 0.3, hit: 1.443958 }, // hit 1.443958 = 데모 배트 끝 속도 최대(k 0.497917, 240표본 구간 중점) 측정값 — 생성값 = 배포값(임시값 1.7은 검토 2차 지적으로 교체)
          // 안 치는 공(볼·스트라이크·블록) 반응 'take'(2026-11-09): Mixamo 'Baseball Step Out'(Without Skin)을 tools/retarget-mixamo.mjs로 이 뼈대에 옮긴 클립(JSON, 대상 원래 뼈 이름). Node 측정: 0.5~1.0 s 배트 내림, 1.25~2.0 s 왼발이 타석 밖(+x 65 cm)으로, 2.5 s부터 서서 쉼 → 호스트 재생 0.3~2.6 s
          // 안타·홈런 타격 'hit'(2026-11-09): Mixamo 'Baseball Hit'(변형 5, Without Skin, 2.9 s)을 같은 도구로 옮긴 클립. 타격 뒤 1루 쪽(-x = 틀의 존 쪽)으로 달려 나간다(Node 측정: 골반 2.0 s -27 cm, 2.5 s -45 cm, 2.9 s -134 cm). playCue.hit는 데모 배트 끝 속도 측정값(assets 메타와 같은 값; 다시 빌드해도 같은 cue)
          extraClips: [{ file: "take.clip.json", name: "take", retargeted: "Mixamo Baseball_Step_Out.fbx(Without Skin)" }, { file: "hit.clip.json", name: "hit", retargeted: "Mixamo Baseball_Hit_5.fbx(Without Skin)" }],
          tga2png: true, standardMaterials: true, dropVertexColors: true, optimizeTracks: true, mergeGroups: true,
          license: "외부 구매 모델(사용 조건은 비공개 기록). 원본·변환본은 Git에 넣지 않는다" },
      };
      const prof = () => PROFILES[$("profile").value] || PROFILES.mixamo;
      const TEX_SLOTS = ["map", "normalMap", "roughnessMap", "metalnessMap", "specularMap", "emissiveMap", "alphaMap", "aoMap", "bumpMap"];
      const logEl = $("log"); const lines = [];
      const log = (s) => { lines.push(s); logEl.textContent = lines.join("\n"); console.log(s); };
      const fmt = (v, d = 3) => (typeof v === "number" ? v.toFixed(d) : String(v));
      const MB = (n) => (n / 1048576).toFixed(3) + " MB";
      async function sha256(buf) { const h = await crypto.subtle.digest("SHA-256", buf); return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join(""); }

      // 작은 미리보기(검사 확인용)
      const canvas = $("view");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x667766, 1.2));
      const dir = new THREE.DirectionalLight(0xffffff, 1.6); dir.position.set(2, 4, 3); scene.add(dir);
      const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
      let preview = null, previewMixer = null, previewAction = null, lastT = performance.now();
      function frame(now) { const dt = (now - lastT) / 1000; lastT = now; if (previewMixer) previewMixer.update(dt); renderer.render(scene, camera); requestAnimationFrame(frame); }
      requestAnimationFrame(frame);

      const loaded = {}; // name -> { group, clip, meshes, bones, bbox }
      let character = null, meta = null, lastBuild = null;
      const origGeo = new Map(); // mesh → 원본(인덱스 없는) geometry. userData가 아니라 Map에 둔다(아래 설명)

      function describe(group) {
        const meshes = [], bones = [];
        group.traverse((o) => { if (o.isSkinnedMesh || o.isMesh) meshes.push(o); if (o.isBone) bones.push(o); });
        const tri = meshes.reduce((n, m) => { const g = m.geometry; return n + (g.index ? g.index.count : g.attributes.position.count) / 3; }, 0);
        const verts = meshes.reduce((n, m) => n + m.geometry.attributes.position.count, 0);
        const box = new THREE.Box3().setFromObject(group); const size = new THREE.Vector3(); box.getSize(size);
        return { meshes, bones, tri, verts, box, size };
      }
      function longestClip(clips) { return clips.reduce((a, b) => (!a || b.duration > a.duration ? b : a), null); }

      /** 손 중점(골반 기준) 속도가 최대인 시각 = 연출 기준 시점 추정(실제 공 접촉 아님). 데모의 배트 끝 속도 기준 추정이 이 값을 덮어쓴다.
       *  속도는 두 표본 사이 구간값이므로 시각은 구간 중점으로 둔다. contactTime과 contactFrac은 같은 시각·같은 클립 길이에서 나온다 */
      function handSpeedCue(group, clip) {
        const mixer = new THREE.AnimationMixer(group); const act = mixer.clipAction(clip); act.setLoop(THREE.LoopOnce, 1); act.clampWhenFinished = true; act.play(); // 반복 재생이면 끝에서 0으로 되감겨 속도가 튄다
        // FBXLoader는 노드 이름에서 콜론을 지운다(mixamorig:RightHand → mixamorigRightHand). 끝 글자로 찾는다
        const find = (suffix) => { let hit = null; group.traverse((o) => { if (!hit && o.isBone && o.name.endsWith(suffix)) hit = o; }); return hit; };
        const lh = find("LeftHand"), rh = find("RightHand"), hips = find("Hips");
        if (!lh || !rh || !hips) return { contactTime: null, contactFrac: null, note: "손/골반 뼈 없음" };
        const step = 1 / 120, N = Math.floor((clip.duration - 1e-3) / step), p = new THREE.Vector3(), q = new THREE.Vector3(), h = new THREE.Vector3();
        let prev = null, best = { speed: -1, t: 0 }, samples = 0;
        for (let i = 0; i <= N; i++) {
          const t = i * step; act.time = t; mixer.update(0); group.updateMatrixWorld(true);
          lh.getWorldPosition(p); rh.getWorldPosition(q); p.add(q).multiplyScalar(0.5); hips.getWorldPosition(h); p.sub(h); // 골반 기준 상대 위치(이동 제거)
          if (prev) { const s = p.distanceTo(prev) / step; samples++; if (s > best.speed) best = { speed: s, t: t - step / 2 }; }
          prev = p.clone();
        }
        mixer.stopAllAction(); mixer.uncacheClip(clip); mixer.setTime(0);
        return { contactTime: best.t, contactFrac: best.t / clip.duration, peakSpeed: best.speed, samples, contactBy: "handSpeed" };
      }

      /** 모든 속성(위치·법선·UV·관절·가중치 …)이 비트 단위로 같은 정점만 하나로 합쳐 인덱스를 만든다. 허용 오차 없음, 삼각형 수 불변 */
      function indexExact(geometry) {
        if (geometry.index) return { geometry, before: geometry.attributes.position.count, after: geometry.attributes.position.count, note: "이미 인덱스 있음" };
        if (Object.keys(geometry.morphAttributes || {}).length) return { geometry, note: "morph 속성 있어 건너뜀" };
        const names = Object.keys(geometry.attributes), attrs = names.map((n) => geometry.attributes[n]);
        const count = attrs[0].count;
        const views = attrs.map((a) => { const arr = a.array; return arr instanceof Float32Array ? new Uint32Array(arr.buffer, arr.byteOffset, arr.length) : arr; });
        const map = new Map(), remap = new Uint32Array(count), srcIndex = []; let next = 0;
        for (let i = 0; i < count; i++) {
          let key = "";
          for (let a = 0; a < attrs.length; a++) { const sz = attrs[a].itemSize, v = views[a], base = i * sz; for (let c = 0; c < sz; c++) key += v[base + c] + ","; key += "|"; }
          let j = map.get(key); if (j === undefined) { j = next++; map.set(key, j); srcIndex.push(i); } remap[i] = j;
        }
        const g = new THREE.BufferGeometry();
        for (let a = 0; a < attrs.length; a++) {
          const src = attrs[a], sz = src.itemSize, Arr = src.array.constructor, out = new Arr(next * sz);
          for (let j = 0; j < next; j++) { const i = srcIndex[j]; for (let c = 0; c < sz; c++) out[j * sz + c] = src.array[i * sz + c]; }
          g.setAttribute(names[a], new THREE.BufferAttribute(out, sz, src.normalized));
        }
        const indexType = next > 65535 ? "Uint32" : "Uint16";
        g.setIndex(new THREE.BufferAttribute(indexType === "Uint16" ? new Uint16Array(remap) : remap, 1));
        g.groups = geometry.groups.map((x) => ({ ...x })); g.name = geometry.name;
        return { geometry: g, before: count, after: next, indexType, attributes: names };
      }
      /** 인덱스화 결과 검증: 인덱스를 풀어 원본과 삼각형별로 비트 단위 비교 */
      function verifyIndexed(orig, idx) {
        const names = Object.keys(orig.attributes); const n = orig.attributes.position.count; if (idx.index.count !== n) return `정점 참조 수 다름 ${idx.index.count} vs ${n}`;
        for (const name of names) {
          const a = orig.attributes[name], b = idx.attributes[name]; if (!b || a.itemSize !== b.itemSize) return `${name} 속성 없음/크기 다름`;
          const av = a.array instanceof Float32Array ? new Uint32Array(a.array.buffer, a.array.byteOffset, a.array.length) : a.array;
          const bv = b.array instanceof Float32Array ? new Uint32Array(b.array.buffer, b.array.byteOffset, b.array.length) : b.array;
          for (let i = 0; i < n; i++) { const j = idx.index.getX(i); for (let c = 0; c < a.itemSize; c++) if (av[i * a.itemSize + c] !== bv[j * a.itemSize + c]) return `${name} 정점 ${i} 성분 ${c} 불일치`; }
        }
        return "일치";
      }

      const fileSha = {}; // name → 이번에 읽은 FBX의 SHA-256(입력 폴더가 바뀌어도 메타에 실제 값이 들어가게; 위 SHA 상수는 기존 마네킹 파일의 기록값)
      let srcDirUsed = "mixamo";
      /** 재질의 텍스처 목록(검사 로그·메타용): 종류, 크기, 출처(embedded blob/data 또는 외부 URL) */
      function textureList(meshes) {
        const out = []; const seen = new Set();
        meshes.forEach((m) => (Array.isArray(m.material) ? m.material : [m.material]).forEach((mm) => { for (const k of ["map", "normalMap", "roughnessMap", "metalnessMap", "specularMap", "emissiveMap", "alphaMap", "aoMap", "bumpMap"]) { const t = mm[k]; if (!t || seen.has(t)) continue; seen.add(t); const img = t.image; const src = img && img.src ? (img.src.startsWith("blob:") ? "embedded(blob)" : img.src.startsWith("data:") ? "embedded(data)" : img.src.split("/").pop()) : "no-image"; out.push({ material: mm.name, slot: k, width: img ? img.width || img.naturalWidth || 0 : 0, height: img ? img.height || img.naturalHeight || 0 : 0, source: src, transparent: !!mm.transparent, alphaTest: mm.alphaTest || 0 }); } }));
        return out;
      }
      async function inspect() {
        lines.length = 0; $("build").disabled = true; $("verify").disabled = true;
        const base = $("base").value.replace(/\/$/, "");
        const srcDir = $("srcDir").value.trim().replace(/^\/+|\/+$/g, ""); if (!/^[A-Za-z0-9_\-/]+$/.test(srcDir)) { log("입력 폴더는 영문·숫자·_·-·/ 만"); return; }
        srcDirUsed = srcDir;
        const P = prof();
        const manager = new THREE.LoadingManager();
        if (P.tga2png) manager.setURLModifier((u) => u.replace(/\.tga(\?.*)?$/i, ".png")); // FBX가 가리키는 .tga를 같은 이름의 .png(미리 변환해 둔 사본)로
        const loader = new FBXLoader(manager);
        for (const name of P.files) {

              Object.assign(d, describe(character)); log("이전 빌드의 배트를 떼어내고 몸만 다시 쟀다");
            }
            try { batInfo = graftBat(character, loaded[P.bat.from].group, P); } catch (e) { log(`중단: 배트 이식 실패 ${e && e.message || e}`); return; }
            log(`배트 이식: ${P.bat.mesh}(${batInfo.vertices} 정점) → ${batInfo.hand} 아래 'Bat'(손 기준 위치 ${batInfo.local.map((x) => fmt(x, 2)).join(",")}), 길이 ${fmt(batInfo.length, 1)} 단위(${batInfo.axis}축), 끝 ${batInfo.tip.map((x) => fmt(x, 1)).join(",")} 손잡이끝 ${batInfo.knob.map((x) => fmt(x, 1)).join(",")}`);
          }
          const dAll = describe(character), texturesFinal = textureList(dAll.meshes);
          character.traverse((o) => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach((mm) => { for (const k of TEX_SLOTS) if (mm[k]) mm[k].userData.mimeType = texMime === "image/png" ? undefined : texMime; }); });
          meta = {
            generatedAt: new Date().toISOString(),
            output: { name, glb: `${name}.glb`, meta: `${name}.meta.json` },
            source: { tool: "relay/batter3d/tools/fbx-to-glb.html + three.js 0.187.0 FBXLoader/GLTFExporter", profile: $("profile").value, dir: srcDirUsed, files: [...P.files.map((n) => ({ name: n + ".fbx", sha256: fileSha[n] || null, sameAsMannequin: SHA[n] ? SHA[n] === fileSha[n] : null })), ...(P.extraClips || []).filter((x) => loaded[x.name]).map((x) => ({ name: x.file, sha256: fileSha[x.file] || null, retargeted: (x.retargeted || "Mixamo(Without Skin)") + " → tools/retarget-mixamo.mjs(월드 회전 변화량 + 휴식 자세 방향 정렬)" }))], license: P.license },
            character: { from: P.charFile + ".fbx", meshes: charSrc.meshes.map((m) => m.name), triangles: Math.round(d.tri), vertices: d.verts, bones: charSrc.bones.length, boneMap: P.boneMap || null, sizeUnits: [charSrc.size.x, charSrc.size.y, charSrc.size.z], floorY: charSrc.box.min.y, boundsMin: [charSrc.box.min.x, charSrc.box.min.y, charSrc.box.min.z], rootScale: character.scale.y, propTriangles: Math.round(dAll.tri - d.tri), textures: texturesFinal.map((t) => ({ material: t.material, slot: t.slot, width: t.width, height: t.height, source: t.source, transparent: t.transparent, alphaTest: t.alphaTest })), textureExport: texturesFinal.length ? { maxSize: texMax === Infinity ? null : texMax, mimeType: texMime } : null },
            indexing,
            fps,
            clips: {},
            contactSource: P.clipMap ? "ANIM_Hit_Ball" : pick,
            contactNote: "clips[*].contactTime/contactFrac은 '연출 기준 시점 추정'(스윙을 호스트 비행 시간에 맞출 기준점)이며 실제 공 접촉 시각이 아니다. 변환기는 손 속도 최대(handSpeed), 데모는 배트 끝 속도 최대(batTipSpeed)로 같은 시각·같은 클립 길이에서 둘을 함께 쓴다",
            bat: batInfo ? { enabled: false, embedded: batInfo, note: "glb 안에 실제 배트 메시를 손 뼈 아래 'Bat' 노드로 넣었다(출처 A-pose 파일의 더미 뼈 로컬 변환 그대로). 모듈의 원통 배트는 끈다(enabled false). BatTip/BatKnob 표지는 배트 끝 속도 측정용" }
              : { bone: "LeftHand", lengthRatio: 0.48, radiusRatio: 0.016, handleRatio: 0.1, position: [0, 0, 0], rotationDeg: [0, 0, 0], note: "아래 손(우타자의 왼손) 뼈 기준 로컬 위치·회전. 위 손은 팔로스루에서 놓는다. 데모 조절 패널에서 맞춘 값으로 갱신한다(비율은 캐릭터 키 대비)" },
          };
          for (const c of clips) {
            const src = clipSrc.get(c) || null;
            const cue = c.name === "idle" || c.name === "prepare" || !src || src.extra ? null : src.cue;
            meta.clips[c.name] = { duration: c.duration, tracks: c.tracks.length, contactTime: cue ? cue.contactTime : null, contactFrac: cue ? cue.contactFrac : null, contactBy: cue ? cue.contactBy : null };
            if (src && src.extra) meta.clips[c.name].source = { file: src.extra.file, sha256: fileSha[src.extra.file] || null, note: `${src.extra.retargeted || "Mixamo(Without Skin)"}을 tools/retarget-mixamo.mjs로 옮긴 클립(${fmt(c.duration, 2)} s). 재생 구간은 play.${c.name}` }; // 항목별 출처(독립 검토: take 문구가 hit에도 붙었음)
          }
          if (P.clipMap) { // 호스트 재생 구간(어댑터 resolvePlay가 읽음): 기준 시점은 손 속도 추정(데모의 batTipSpeed로 갱신 가능), 끝은 P.playEnd(contact 1.85 s: 그 뒤는 1루 달리기) 또는 클립 끝(miss: 타격 자세로 복귀 — 11/9 Node 측정)
            const cc = meta.clips.contact, mm = meta.clips.miss;
            const endOf = (name, c) => (P.playEnd && Number.isFinite(P.playEnd[name]) ? Math.min(P.playEnd[name], c.duration) : c.duration);
            if (cc && mm && cc.contactTime != null && mm.contactTime != null) meta.play = { contact: { clip: "contact", cue: cc.contactTime, end: endOf("contact", cc) }, miss: { clip: "miss", cue: mm.contactTime, end: endOf("miss", mm) }, note: "cue = 연출 기준 시점 추정(손 속도 최대; 데모의 배트 끝 속도 측정으로 갱신, 실제 접촉 아님), end = 재생 끝(프로필 playEnd가 있으면 그 값, 없으면 원본 클립 끝)" };
            if (meta.play && meta.clips.take) meta.play.take = { clip: "take", cue: P.playCue && Number.isFinite(P.playCue.take) ? Math.min(P.playCue.take, meta.clips.take.duration) : 0, end: endOf("take", meta.clips.take), note: "안 치는 공 반응: cue = 재생 시작 시각(공 도착 + 어댑터 지연 뒤), end = 재생 끝. 선택 사항 — 없으면 어댑터 react()가 null을 돌려 호스트는 전처럼 아무 동작 없음" };
            if (meta.play && meta.clips.hit) meta.play.hit = { clip: "hit", cue: P.playCue && Number.isFinite(P.playCue.hit) ? Math.min(P.playCue.hit, meta.clips.hit.duration) : 0, end: endOf("hit", meta.clips.hit), note: "안타·홈런 타격(치고 1루 쪽으로 달려 나감): cue = 연출 기준 시점(프로필 playCue 임시값 → 데모 배트 끝 속도 측정으로 갱신, 실제 접촉 아님), end = 재생 끝. 선택 사항 — 없으면 어댑터 swing('hit')가 contact로 대체" };
          }
          log(`glb 만들기 ${name}: 클립 ${clips.map((c) => `${c.name}(${fmt(c.duration, 2)}s)`).join(", ")} | 삼각형 ${Math.round(d.tri)} 정점 ${d.verts}`);
          const exporter = new GLTFExporter();
          let glb;
          try { glb = await exporter.parseAsync(character, { binary: true, animations: clips, onlyVisible: false, trs: false, includeCustomExtensions: false, maxTextureSize: texMax }); }
          catch (e) { log(`내보내기 실패: ${e && e.message ? e.message : e}`); return; }
          const glbSha = await sha256(glb);
          meta.output.glbBytes = glb.byteLength; meta.output.glbSha256 = glbSha;
          const metaText = JSON.stringify(meta, null, 2), metaBytes = new TextEncoder().encode(metaText), metaSha = await sha256(metaBytes);
          log(`glb ${glb.byteLength.toLocaleString()} bytes (${MB(glb.byteLength)}) SHA-256 ${glbSha} | meta ${metaBytes.length} bytes SHA-256 ${metaSha}`);
          // 저장: 응답이 실패면 즉시 중단(메타도 저장하지 않음)
          log(`저장 ${name}.glb: ${await postOrAbort(glbUrl, glb)}`);
          log(`저장 ${name}.meta.json: ${await postOrAbort(metaUrl, metaText, { "Content-Type": "application/json" })}`);
          // 다시 읽어 해시 대조
          const back1 = await (await fetch(`${glbUrl}?t=${Date.now()}`, { cache: "no-store" })).arrayBuffer();
          const back2 = await (await fetch(`${metaUrl}?t=${Date.now()}`, { cache: "no-store" })).arrayBuffer();
          const back1Sha = await sha256(back1), back2Sha = await sha256(back2);

          log(`다시 읽어 대조: glb ${okGlb ? "일치" : "불일치"} (${back1.byteLength.toLocaleString()} bytes, ${back1Sha.slice(0, 16)}…) | meta ${okMeta ? "일치" : "불일치"} (${back2.byteLength} bytes, ${back2Sha.slice(0, 16)}…)`);
          if (!(okGlb && okMeta)) { log("중단: 저장된 파일이 보낸 것과 다르다"); return; }
          $("verify").disabled = false;
        } finally { $("build").disabled = false; }
      }

      async function verify() {
        const base = $("base").value.replace(/\/$/, ""), name = $("outName").value.trim();
        const url = `${base}/build/${name}.glb?t=${Date.now()}`;
        const buf = await (await fetch(url, { cache: "no-store" })).arrayBuffer(); const sha = await sha256(buf);
        const gltf = await new GLTFLoader().parseAsync(buf, "");
        const d = describe(gltf.scene);
        log(`다시 읽음 ${name}.glb: ${buf.byteLength.toLocaleString()} bytes SHA-256 ${sha}${lastBuild && lastBuild.name === name ? (sha === lastBuild.glbSha256 ? " (만든 것과 일치)" : " (만든 것과 불일치!)") : ""} | 메시 ${d.meshes.length}(${d.meshes.map((m) => m.name + (m.geometry.index ? ":indexed" : ":non-indexed")).join(", ")}) 삼각형 ${Math.round(d.tri)} 정점 ${d.verts} 뼈 ${d.bones.length} 크기 ${fmt(d.size.x, 2)}×${fmt(d.size.y, 2)}×${fmt(d.size.z, 2)} | 클립 ${gltf.animations.map((c) => `${c.name} ${fmt(c.duration, 2)}s/${c.tracks.length}`).join("; ")}`);

        previewMixer = new THREE.AnimationMixer(preview); previewMixer.clipAction(gltf.animations.find((x) => x.name === "miss") || gltf.animations[0]).play();
        window.__pz = { gltf, meta, lastBuild };
      }

      function applyProfileUI() { const P = prof(); $("srcDir").value = P.srcDir; $("outName").value = P.outName; $("contactPickWrap").hidden = !!P.clipMap; for (const k of Object.keys(loaded)) delete loaded[k]; $("build").disabled = true; $("verify").disabled = true; lines.length = 0; log(`캐릭터 종류 ${$("profile").value}: 파일 ${P.files.join(", ")} (필수 ${P.required.join(", ")})`); }
      $("profile").addEventListener("change", applyProfileUI);
      $("inspect").addEventListener("click", () => inspect().catch((e) => log("오류: " + (e && e.stack || e))));
      $("build").addEventListener("click", () => build().catch((e) => log("중단(오류): " + (e && e.message || e))));
      $("verify").addEventListener("click", () => verify().catch((e) => log("오류: " + (e && e.stack || e))));
      window.__pzTool = { inspect, build, verify, loaded: () => loaded, meta: () => meta, lastBuild: () => lastBuild };
    </script>
