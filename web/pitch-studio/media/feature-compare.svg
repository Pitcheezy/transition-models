<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">같은 공의 추천 위치와 실제 위치 비교</title>
  <desc id="desc">기능 안내 개념도. 점선 참고 존 위에서 추천은 연두 사각형, 공개 후 실제 플레이트 통과 위치는 주황 점으로 구별합니다. 실제 좌표나 제구 오차를 나타내는 그림이 아닙니다.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#183a2b"/><stop offset="1" stop-color="#091811"/></linearGradient></defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <g font-family="'Malgun Gothic','Segoe UI',sans-serif">
    <text x="32" y="39" fill="#ceff78" font-size="20" font-weight="700" letter-spacing="2">기능 안내</text>
    <text x="32" y="83" fill="#f2f4e9" font-size="34" font-weight="750">추천과 실제를 함께</text>
    <rect x="32" y="108" width="576" height="256" rx="18" fill="#11241b" stroke="#52705a"/>
    <rect x="52" y="126" width="252" height="220" rx="12" fill="#0b1c13" stroke="#2c4735"/>
    <path d="M70 181H286M70 236H286M70 291H286M124 143V329M178 143V329M232 143V329" stroke="#385341" stroke-opacity=".6"/>
    <rect x="116" y="164" width="124" height="145" fill="none" stroke="#d0d9c8" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M157 164V309M199 164V309M116 212H240M116 260H240" stroke="#70836c" stroke-opacity=".5"/>
    <rect x="138" y="213" width="40" height="40" rx="6" fill="#ceff78" stroke="#efffce" stroke-width="1.5"/>
    <text x="158" y="242" text-anchor="middle" fill="#11241b" font-size="25" font-weight="800">1</text>
    <circle cx="218" cy="274" r="23" fill="none" stroke="#ff9b7f" stroke-width="2.5" stroke-opacity=".7"/>
    <circle cx="218" cy="274" r="11" fill="#ff9b7f" stroke="#ffe2d5" stroke-width="2"/>
    <rect x="334" y="159" width="24" height="24" rx="4" fill="#ceff78"/>
    <text x="374" y="180" fill="#e6f9cc" font-size="27" font-weight="750">추천 위치</text>
    <text x="334" y="213" fill="#bacdbb" font-size="21">기록 분포의 근사</text>
    <circle cx="346" cy="254" r="12" fill="#ff9b7f"/>
    <text x="374" y="264" fill="#ffceb9" font-size="27" font-weight="750">실제 공</text>
    <text x="334" y="297" fill="#bacdbb" font-size="21">공개 후 통과 위치</text>
    <text x="320" y="398" text-anchor="middle" fill="#bdcdbd" font-size="20">참고 존 개념도 · 실제 좌표·제구 오차 아님</text>
  </g>
</svg>
