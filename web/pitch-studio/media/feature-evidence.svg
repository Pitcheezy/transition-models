<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">모델이 사용한 자료와 검증 범위 확인</title>
  <desc id="desc">기능 안내 그림. 경기 상황에서 추천을 만들고 실제와 비교하는 흐름 아래에 예측 평가와 추천 효과를 별도로 표시합니다. 예측이 좋아졌다는 결과를 추천 효과와 같은 의미로 취급하지 않습니다.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#183a2b"/><stop offset="1" stop-color="#091811"/></linearGradient></defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <g font-family="'Malgun Gothic','Segoe UI',sans-serif">
    <text x="32" y="39" fill="#ceff78" font-size="20" font-weight="700" letter-spacing="2">기능 안내</text>
    <text x="32" y="83" fill="#f2f4e9" font-size="34" font-weight="750">추천의 근거까지</text>
    <rect x="32" y="108" width="576" height="278" rx="18" fill="#11241b" stroke="#52705a"/>
    <g stroke="#54735a">
      <rect x="52" y="129" width="148" height="84" rx="12" fill="#1b3727"/>
      <rect x="246" y="129" width="148" height="84" rx="12" fill="#ceff78" stroke="#ceff78"/>
      <rect x="440" y="129" width="148" height="84" rx="12" fill="#1b3727"/>
    </g>
    <g fill="none" stroke="#a5bc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M211 171H234m-8-8 8 8-8 8M405 171H428m-8-8 8 8-8 8"/>
    </g>
    <g font-size="28" font-weight="750" text-anchor="middle">
      <text x="126" y="181" fill="#f2f4e9">경기 상황</text>
      <text x="320" y="181" fill="#11241b">추천</text>
      <text x="514" y="181" fill="#f2f4e9">실제 비교</text>
    </g>
    <path d="M52 236H588" stroke="#3c5844"/>
    <rect x="52" y="256" width="256" height="108" rx="12" fill="#172c24" stroke="#66835c"/>
    <rect x="332" y="256" width="256" height="108" rx="12" fill="#252d23" stroke="#88785d"/>
    <g text-anchor="middle">
      <text x="180" y="295" fill="#d6f6b3" font-size="27" font-weight="750">예측 평가</text>
      <text x="180" y="333" fill="#c2d2bf" font-size="22">결과를 잘 맞혔나?</text>
      <text x="460" y="295" fill="#ffd0b5" font-size="27" font-weight="750">추천 효과</text>
      <text x="460" y="333" fill="#d2cbbc" font-size="22">더 좋은 선택인가?</text>
    </g>
  </g>
</svg>
