<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">투구 전에 구종과 위치 후보 확인</title>
  <desc id="desc">기능 안내 개념도. 1위부터 3위까지의 추천 후보를 연두 원과 목록으로 보여줍니다. 표시 위치는 실제 투구나 실제 추천 수치가 아닙니다.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#183a2b"/><stop offset="1" stop-color="#091811"/></linearGradient></defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <g font-family="'Malgun Gothic','Segoe UI',sans-serif">
    <text x="32" y="39" fill="#ceff78" font-size="20" font-weight="700" letter-spacing="2">기능 안내</text>
    <text x="32" y="83" fill="#f2f4e9" font-size="34" font-weight="750">던지기 전, 추천 확인</text>
    <rect x="32" y="108" width="576" height="256" rx="18" fill="#11241b" stroke="#52705a"/>
    <rect x="52" y="126" width="224" height="220" rx="12" fill="#0b1c13" stroke="#2c4735"/>
    <path d="M69 181H259M69 236H259M69 291H259M117 143V329M164 143V329M211 143V329" stroke="#385341" stroke-opacity=".6"/>
    <rect x="106" y="164" width="116" height="145" fill="none" stroke="#cbd6c5" stroke-width="2" stroke-dasharray="6 5"/>
    <g fill="#ceff78" stroke="#efffce" stroke-width="1.5">
      <circle cx="177" cy="259" r="20"/>
      <circle cx="121" cy="217" r="20"/>
      <circle cx="207" cy="177" r="20"/>
    </g>
    <g fill="#11241b" font-size="25" font-weight="800" text-anchor="middle">
      <text x="177" y="268">1</text><text x="121" y="226">2</text><text x="207" y="186">3</text>
    </g>
    <text x="300" y="147" fill="#c5d8bf" font-size="21">투구 전 · 구종 후보</text>
    <g fill="#1b3926" stroke="#4d7045">
      <rect x="296" y="165" width="290" height="52" rx="9"/>
      <rect x="296" y="228" width="290" height="52" rx="9"/>
      <rect x="296" y="291" width="290" height="52" rx="9"/>
    </g>
    <g fill="#ceff78" font-size="25" font-weight="800">
      <text x="312" y="200">1</text><text x="312" y="263">2</text><text x="312" y="326">3</text>
    </g>
    <g fill="#f2f4e9" font-size="24" font-weight="650">
      <text x="349" y="200">첫 번째 후보</text><text x="349" y="263">두 번째 후보</text><text x="349" y="326">세 번째 후보</text>
    </g>
    <text x="320" y="398" text-anchor="middle" fill="#bdcdbd" font-size="20">위치 개념도 · 실제 투구 수치 아님</text>
  </g>
</svg>
