      <rect x="318" y="291" width="116" height="65" rx="12"/>
      <rect x="456" y="291" width="116" height="65" rx="12"/>
    </g>
    <g fill="#e7f6d6" font-size="27" font-weight="700" text-anchor="middle">
      <text x="238" y="333">1구</text><text x="376" y="333">2구</text><text x="514" y="333">3구</text>
    </g>
  </g>
</svg>
