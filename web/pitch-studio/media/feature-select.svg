<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">타석을 고르고 원하는 공으로 이동</title>
  <desc id="desc">기능 안내 그림. 기록 경기의 타석 목록에서 첫 타석을 선택하고 1구, 2구, 3구로 이동하는 화면을 표현합니다.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#183a2b"/><stop offset="1" stop-color="#091811"/></linearGradient>
    <linearGradient id="selected" x2="1"><stop stop-color="#ceff78"/><stop offset="1" stop-color="#bce973"/></linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <path d="M422 420 640 202M496 420 640 276" stroke="#ceff78" stroke-opacity=".05" stroke-width="36"/>
  <g font-family="'Malgun Gothic','Segoe UI',sans-serif">
    <text x="32" y="39" fill="#ceff78" font-size="20" font-weight="700" letter-spacing="2">기능 안내</text>
    <text x="32" y="83" fill="#f2f4e9" font-size="34" font-weight="750">원하는 타석부터</text>
    <rect x="32" y="108" width="576" height="278" rx="18" fill="#11241b" stroke="#52705a"/>
    <path d="M32 167H608" stroke="#3d5845"/>
    <circle cx="60" cy="137" r="6" fill="#ceff78"/>
    <text x="80" y="146" fill="#f2f4e9" font-size="24" font-weight="650">기록 경기</text>
    <text x="582" y="146" text-anchor="end" fill="#bacbbd" font-size="23">CHC · SD</text>
    <rect x="50" y="184" width="540" height="78" rx="12" fill="url(#selected)"/>
    <rect x="65" y="202" width="70" height="42" rx="8" fill="#102313" fill-opacity=".11"/>
    <text x="100" y="230" text-anchor="middle" fill="#11241b" font-size="23" font-weight="750">선택</text>
    <text x="153" y="218" fill="#11241b" font-size="28" font-weight="800">첫 타석</text>
    <text x="153" y="246" fill="#294326" font-size="21">1회 초 · 투구 순서대로 보기</text>
    <path d="m553 214 9 9-9 9" fill="none" stroke="#11241b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
